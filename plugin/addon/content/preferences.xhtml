<linkset>
    <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>

<vbox
    id="__addonRef__-prefs"
    class="pdf2zh-prefs"
    onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window });"
>
    <html:div class="p2z" data-engine="pdf2zh_next">
        <html:header class="p2z-hero">
            <html:img
                class="p2z-hero-logo"
                src="chrome://__addonRef__/content/icons/favicon.svg"
                alt=""
            />
            <html:div class="p2z-hero-text">
                <html:h1>Zotero PDF2zh</html:h1>
                <html:p data-l10n-id="pref-tagline" />
            </html:div>
            <html:span
                class="p2z-chip"
                data-l10n-id="pref-help"
                data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
            />
        </html:header>

        <!-- ============================ Server ============================ -->
        <html:section class="p2z-card">
            <html:header class="p2z-card-head">
                <html:h2 data-l10n-id="pref-sec-server" />
                <html:p data-l10n-id="pref-sec-server-desc" />
            </html:header>
            <html:div class="p2z-row">
                <html:div class="p2z-row-text">
                    <html:label
                        class="p2z-row-title"
                        for="__addonRef__-serverUrl"
                        data-l10n-id="pref-serverip"
                    />
                    <html:p
                        class="p2z-row-desc"
                        data-l10n-id="pref-serverip-desc"
                    />
                </html:div>
                <html:div class="p2z-row-ctl">
                    <html:input
                        id="__addonRef__-serverUrl"
                        class="p2z-input p2z-w-lg"
                        type="text"
                        spellcheck="false"
                        placeholder="http://localhost:8890"
                        data-pref="new_serverip"
                    />
                    <html:button
                        id="__addonRef__-checkConnection"
                        class="p2z-btn"
                        type="button"
                        data-l10n-id="pref-check-connection"
                    />
                </html:div>
            </html:div>
            <html:div
                id="__addonRef__-server-status"
                class="p2z-status"
                data-state="idle"
                role="status"
            >
                <html:span class="p2z-status-dot" />
                <html:span class="p2z-status-text" />
            </html:div>
        </html:section>

        <!-- ========================== Translation ========================== -->
        <html:section class="p2z-card">
            <html:header class="p2z-card-head">
                <html:h2 data-l10n-id="pref-sec-translate" />
            </html:header>

            <html:div class="p2z-row">
                <html:div class="p2z-row-text">
                    <html:span
                        class="p2z-row-title"
                        data-l10n-id="pref-engine"
                    />
                    <html:p
                        class="p2z-row-desc"
                        data-l10n-id="pref-engine-desc"
                    />
                </html:div>
                <html:div class="p2z-row-ctl">
                    <html:div
                        id="__addonRef__-engine"
                        class="p2z-segmented"
                        role="radiogroup"
                    >
                        <html:button
                            type="button"
                            role="radio"
                            data-engine-value="pdf2zh_next"
                            data-l10n-id="pref-engine-next"
                        />
                        <html:button
                            type="button"
                            role="radio"
                            data-engine-value="pdf2zh"
                            data-l10n-id="pref-engine-legacy"
                        />
                    </html:div>
                </html:div>
            </html:div>

            <html:div class="p2z-row">
                <html:div class="p2z-row-text">
                    <html:label
                        class="p2z-row-title"
                        for="__addonRef__-serviceSelect"
                        data-l10n-id="pref-service"
                    />
                    <html:p
                        class="p2z-row-desc"
                        data-l10n-id="pref-service-desc"
                    />
                </html:div>
                <html:div class="p2z-row-ctl">
                    <html:select
                        id="__addonRef__-serviceSelect"
                        class="p2z-select p2z-w-xl"
                    />
                </html:div>
                <html:div
                    id="__addonRef__-service-hint"
                    class="p2z-note"
                    data-tone="info"
                />
            </html:div>

            <html:div class="p2z-row p2z-row-wide-ctl">
                <html:div class="p2z-row-text">
                    <html:span
                        class="p2z-row-title"
                        data-l10n-id="pref-languages"
                    />
                    <html:p
                        class="p2z-row-desc"
                        data-l10n-id="pref-languages-desc"
                    />
                </html:div>
                <html:div class="p2z-row-ctl p2z-lang">
                    <html:div class="p2z-lang-field">
                        <html:select
                            id="__addonRef__-sourceLang"
                            class="p2z-select"
                            data-l10n-id="pref-sourceLang"
                        />
                        <html:input
                            id="__addonRef__-sourceLang-custom"
                            class="p2z-input"
                            type="text"
                            spellcheck="false"
                            hidden="hidden"
                            data-l10n-id="pref-lang-custom"
                        />
                    </html:div>
                    <html:button
                        id="__addonRef__-swapLang"
                        class="p2z-btn p2z-btn-icon"
                        type="button"
                        data-l10n-id="pref-swapLang"
                    >
                        ⇄
                    </html:button>
                    <html:div class="p2z-lang-field">
                        <html:select
                            id="__addonRef__-targetLang"
                            class="p2z-select"
                            data-l10n-id="pref-targetLang"
                        />
                        <html:input
                            id="__addonRef__-targetLang-custom"
                            class="p2z-input"
                            type="text"
                            spellcheck="false"
                            hidden="hidden"
                            data-l10n-id="pref-lang-custom"
                        />
                    </html:div>
                </html:div>
            </html:div>

            <html:div class="p2z-row">
                <html:div class="p2z-row-text">
                    <html:label
                        class="p2z-row-title"
                        for="__addonRef__-skipLastPages"
                        data-l10n-id="pref-skipLastPages"
                    />
                    <html:p
                        class="p2z-row-desc"
                        data-l10n-id="pref-skipLastPages-desc"
                    />
                </html:div>
                <html:div class="p2z-row-ctl">
                    <html:input
                        id="__addonRef__-skipLastPages"
                        class="p2z-input p2z-w-num"
                        type="number"
                        min="0"
                        max="999"
                        data-pref="skipLastPages"
                    />
                </html:div>
            </html:div>
        </html:section>

        <!-- ========================== API profiles ========================== -->
        <html:section class="p2z-card">
            <html:header class="p2z-card-head p2z-card-head-action">
                <html:div>
                    <html:h2 data-l10n-id="pref-sec-profiles" />
                    <html:p data-l10n-id="pref-sec-profiles-desc" />
                </html:div>
                <html:button
                    id="__addonRef__-llmapi-add"
                    class="p2z-btn p2z-btn-primary"
                    type="button"
                    data-l10n-id="pref-llmapi-add"
                />
            </html:header>
            <html:div id="__addonRef__-profiles" class="p2z-profiles" />
        </html:section>

        <!-- ============================ Output ============================ -->
        <html:section class="p2z-card">
            <html:header class="p2z-card-head">
                <html:h2 data-l10n-id="pref-gen" />
                <html:p data-l10n-id="pref-gen-desc" />
            </html:header>

            <html:div class="p2z-table" role="table">
                <html:div class="p2z-table-head" role="row">
                    <html:span
                        role="columnheader"
                        data-l10n-id="pref-col-file"
                    />
                    <html:span
                        role="columnheader"
                        data-l10n-id="pref-col-generate"
                    />
                    <html:span role="columnheader" data-l10n-id="pref-open" />
                </html:div>
                <html:div class="p2z-table-row" role="row" data-output="mono">
                    <html:label class="p2z-row-text" for="__addonRef__-mono">
                        <html:span
                            class="p2z-row-title"
                            data-l10n-id="pref-mono"
                        />
                        <html:span
                            class="p2z-row-desc"
                            data-l10n-id="pref-mono-desc"
                        />
                    </html:label>
                    <html:input
                        id="__addonRef__-mono"
                        class="p2z-check"
                        type="checkbox"
                        data-pref="mono"
                    />
                    <html:input
                        class="p2z-check"
                        type="checkbox"
                        data-pref="mono-open"
                    />
                </html:div>
                <html:div class="p2z-table-row" role="row" data-output="dual">
                    <html:label class="p2z-row-text" for="__addonRef__-dual">
                        <html:span
                            class="p2z-row-title"
                            data-l10n-id="pref-dual"
                        />
                        <html:span
                            class="p2z-row-desc"
                            data-l10n-id="pref-dual-desc"
                        />
                    </html:label>
                    <html:input
                        id="__addonRef__-dual"
                        class="p2z-check"
                        type="checkbox"
                        data-pref="dual"
                    />
                    <html:input
                        class="p2z-check"
                        type="checkbox"
                        data-pref="dual-open"
                    />
                </html:div>
                <html:div
                    class="p2z-table-row"
                    role="row"
                    data-output="mono-cut"
                >
                    <html:label
                        class="p2z-row-text"
                        for="__addonRef__-mono-cut"
                    >
                        <html:span
                            class="p2z-row-title"
                            data-l10n-id="pref-mono-cut"
                        />
                        <html:span
                            class="p2z-row-desc"
                            data-l10n-id="pref-mono-cut-desc"
                        />
                    </html:label>
                    <html:input
                        id="__addonRef__-mono-cut"
                        class="p2z-check"
                        type="checkbox"
                        data-pref="mono-cut"
                    />
                    <html:input
                        class="p2z-check"
                        type="checkbox"
                        data-pref="mono-cut-open"
                    />
                </html:div>
                <html:div
                    class="p2z-table-row"
                    role="row"
                    data-output="dual-cut"
                >
                    <html:label
                        class="p2z-row-text"
                        for="__addonRef__-dual-cut"
                    >
                        <html:span
                            class="p2z-row-title"
                            data-l10n-id="pref-dual-cut"
                        />
                        <html:span
                            class="p2z-row-desc"
                            data-l10n-id="pref-dual-cut-desc"
                        />
                    </html:label>
                    <html:input
                        id="__addonRef__-dual-cut"
                        class="p2z-check"
                        type="checkbox"
                        data-pref="dual-cut"
                    />
                    <html:input
                        class="p2z-check"
                        type="checkbox"
                        data-pref="dual-cut-open"
                    />
                </html:div>
                <html:div
                    class="p2z-table-row"
                    role="row"
                    data-output="crop-compare"
                >
                    <html:label
                        class="p2z-row-text"
                        for="__addonRef__-crop-compare"
                    >
                        <html:span
                            class="p2z-row-title"
                            data-l10n-id="pref-crop-compare"
                        />
                        <html:span
                            class="p2z-row-desc"
                            data-l10n-id="pref-crop-compare-desc"
                        />
                    </html:label>
                    <html:input
                        id="__addonRef__-crop-compare"
                        class="p2z-check"
                        type="checkbox"
                        data-pref="crop-compare"
                    />
                    <html:input
                        class="p2z-check"
                        type="checkbox"
                        data-pref="crop-compare-open"
                    />
                </html:div>
                <html:div
                    class="p2z-table-row"
                    role="row"
                    data-output="compare"
                >
                    <html:label class="p2z-row-text" for="__addonRef__-compare">
                        <html:span
                            class="p2z-row-title"
                            data-l10n-id="pref-compare"
                        />
                        <html:span
                            class="p2z-row-desc"
                            data-l10n-id="pref-compare-desc"
                        />
                    </html:label>
                    <html:input
                        id="__addonRef__-compare"
                        class="p2z-check"
                        type="checkbox"
                        data-pref="compare"
                    />
                    <html:input
                        class="p2z-check"
                        type="checkbox"
                        data-pref="compare-open"
                    />
                </html:div>
            </html:div>
            <html:div
                id="__addonRef__-output-warning"
                class="p2z-note"
                data-tone="warn"
                hidden="hidden"
                data-l10n-id="pref-output-none"
            />

            <html:div class="p2z-row" data-for-engine="pdf2zh_next">
                <html:div class="p2z-row-text">
                    <html:label
                        class="p2z-row-title"
                        for="__addonRef__-dualMode"
                        data-l10n-id="pref-dualMode"
                    />
                    <html:p
                        class="p2z-row-desc"
                        data-l10n-id="pref-dualMode-desc"
                    />
                </html:div>
                <html:div class="p2z-row-ctl">
                    <html:select
                        id="__addonRef__-dualMode"
                        class="p2z-select"
                        data-pref="dualMode"
                    >
                        <html:option
                            value="LR"
                            data-l10n-id="pref-dualMode-lr"
                        />
                        <html:option
                            value="TB"
                            data-l10n-id="pref-dualMode-tb"
                        />
                    </html:select>
                </html:div>
            </html:div>
            <html:div class="p2z-row" data-for-engine="pdf2zh_next">
                <html:div class="p2z-row-text">
                    <html:label
                        class="p2z-row-title"
                        for="__addonRef__-transFirst"
                        data-l10n-id="pref-transFirst"
                    />
                    <html:p
                        class="p2z-row-desc"
                        data-l10n-id="pref-transFirst-desc"
                    />
                </html:div>
                <html:div class="p2z-row-ctl">
                    <html:input
                        id="__addonRef__-transFirst"
                        class="p2z-switch"
                        type="checkbox"
                        data-pref="transFirst"
                    />
                </html:div>
            </html:div>
            <html:div class="p2z-row">
                <html:div class="p2z-row-text">
                    <html:label
                        class="p2z-row-title"
                        for="__addonRef__-rename"
                        data-l10n-id="pref-rename"
                    />
                    <html:p
                        class="p2z-row-desc"
                        data-l10n-id="pref-rename-desc"
                    />
                </html:div>
                <html:div class="p2z-row-ctl">
                    <html:input
                        id="__addonRef__-rename"
                        class="p2z-switch"
                        type="checkbox"
                        data-pref="rename"
                    />
                </html:div>
            </html:div>
            <html:div class="p2z-row">
                <html:div class="p2z-row-text">
                    <html:label
                        class="p2z-row-title"
                        for="__addonRef__-showProgress"
                        data-l10n-id="pref-showProgress"
                    />
                    <html:p
                        class="p2z-row-desc"
                        data-l10n-id="pref-showProgress-desc"
                    />
                </html:div>
                <html:div class="p2z-row-ctl">
                    <html:input
                        id="__addonRef__-showProgress"
                        class="p2z-switch"
                        type="checkbox"
                        data-pref="showProgress"
                    />
                </html:div>
            </html:div>
        </html:section>

        <!-- ===================== Speed and terminology ===================== -->
        <html:section class="p2z-card">
            <html:header class="p2z-card-head">
                <html:h2 data-l10n-id="pref-sec-speed" />
                <html:p data-l10n-id="pref-sec-speed-desc" />
            </html:header>

            <html:div class="p2z-row" data-for-engine="pdf2zh_next">
                <html:div class="p2z-row-text">
                    <html:label
                        class="p2z-row-title"
                        for="__addonRef__-qps"
                        data-l10n-id="pref-qps"
                    />
                    <html:p class="p2z-row-desc" data-l10n-id="pref-qps-desc" />
                </html:div>
                <html:div class="p2z-row-ctl">
                    <html:input
                        id="__addonRef__-qps"
                        class="p2z-input p2z-w-num"
                        type="number"
                        min="1"
                        max="1000"
                        data-pref="qps"
                    />
                </html:div>
            </html:div>
            <html:div class="p2z-row" data-for-engine="pdf2zh_next">
                <html:div class="p2z-row-text">
                    <html:label
                        class="p2z-row-title"
                        for="__addonRef__-poolSize"
                        data-l10n-id="pref-poolSize"
                    />
                    <html:p
                        class="p2z-row-desc"
                        data-l10n-id="pref-poolSize-desc"
                    />
                </html:div>
                <html:div class="p2z-row-ctl">
                    <html:input
                        id="__addonRef__-poolSize"
                        class="p2z-input p2z-w-num"
                        type="number"
                        min="0"
                        max="1000"
                        data-pref="poolSize"
                    />
                </html:div>
            </html:div>
            <html:div class="p2z-row" data-for-engine="pdf2zh">
                <html:div class="p2z-row-text">
                    <html:label
                        class="p2z-row-title"
                        for="__addonRef__-threadNum"
                        data-l10n-id="pref-threadNum"
                    />
                    <html:p
                        class="p2z-row-desc"
                        data-l10n-id="pref-threadNum-desc"
                    />
                </html:div>
                <html:div class="p2z-row-ctl">
                    <html:input
                        id="__addonRef__-threadNum"
                        class="p2z-input p2z-w-num"
                        type="number"
                        min="1"
                        max="256"
                        data-pref="threadNum"
                    />
                </html:div>
            </html:div>

            <html:div class="p2z-subhead" data-for-engine="pdf2zh_next">
                <html:h3 data-l10n-id="pref-sec-glossary" />
            </html:div>
            <html:div class="p2z-row" data-for-engine="pdf2zh_next">
                <html:div class="p2z-row-text">
                    <html:label
                        class="p2z-row-title"
                        for="__addonRef__-autoGlossary"
                        data-l10n-id="pref-autoGlossary"
                    />
                    <html:p
                        class="p2z-row-desc"
                        data-l10n-id="pref-autoGlossary-desc"
                    />
                </html:div>
                <html:div class="p2z-row-ctl">
                    <html:input
                        id="__addonRef__-autoGlossary"
                        class="p2z-switch"
                        type="checkbox"
                        data-pref="disableGlossary"
                        data-invert="true"
                    />
                </html:div>
            </html:div>
            <html:div
                class="p2z-row p2z-row-nested"
                data-for-engine="pdf2zh_next"
                data-needs-glossary="true"
            >
                <html:div class="p2z-row-text">
                    <html:label
                        class="p2z-row-title"
                        for="__addonRef__-termPoolSize"
                        data-l10n-id="pref-termPoolSize"
                    />
                    <html:p
                        class="p2z-row-desc"
                        data-l10n-id="pref-termPoolSize-desc"
                    />
                </html:div>
                <html:div class="p2z-row-ctl">
                    <html:input
                        id="__addonRef__-termPoolSize"
                        class="p2z-input p2z-w-num"
                        type="number"
                        min="0"
                        max="1000"
                        data-pref="termPoolSize"
                    />
                </html:div>
            </html:div>
            <html:div
                class="p2z-row p2z-row-nested"
                data-for-engine="pdf2zh_next"
                data-needs-glossary="true"
            >
                <html:div class="p2z-row-text">
                    <html:label
                        class="p2z-row-title"
                        for="__addonRef__-saveGlossary"
                        data-l10n-id="pref-saveGlossary"
                    />
                    <html:p
                        class="p2z-row-desc"
                        data-l10n-id="pref-saveGlossary-desc"
                    />
                </html:div>
                <html:div class="p2z-row-ctl">
                    <html:input
                        id="__addonRef__-saveGlossary"
                        class="p2z-switch"
                        type="checkbox"
                        data-pref="saveGlossary"
                    />
                </html:div>
            </html:div>
        </html:section>

        <!-- ====================== Advanced: pdf2zh_next ====================== -->
        <html:details class="p2z-card p2z-fold" data-for-engine="pdf2zh_next">
            <html:summary class="p2z-card-head">
                <html:h2 data-l10n-id="pref-pdf2x-config-title" />
                <html:p data-l10n-id="pref-pdf2x-config-desc" />
            </html:summary>

            <html:div class="p2z-row">
                <html:div class="p2z-row-text">
                    <html:label
                        class="p2z-row-title"
                        for="__addonRef__-fontFamily"
                        data-l10n-id="pref-fontFamily"
                    />
                    <html:p
                        class="p2z-row-desc"
                        data-l10n-id="pref-fontFamily-desc"
                    />
                </html:div>
                <html:div class="p2z-row-ctl">
                    <html:select
                        id="__addonRef__-fontFamily"
                        class="p2z-select"
                        data-pref="fontFamily"
                    >
                        <html:option
                            value="auto"
                            data-l10n-id="pref-fontFamily-auto"
                        />
                        <html:option
                            value="serif"
                            data-l10n-id="pref-fontFamily-serif"
                        />
                        <html:option
                            value="sans-serif"
                            data-l10n-id="pref-fontFamily-sans"
                        />
                        <html:option
                            value="script"
                            data-l10n-id="pref-fontFamily-script"
                        />
                    </html:select>
                </html:div>
            </html:div>
            <html:div class="p2z-row">
                <html:div class="p2z-row-text">
                    <html:label
                        class="p2z-row-title"
                        for="__addonRef__-noWatermark"
                        data-l10n-id="pref-noWatermark"
                    />
                    <html:p
                        class="p2z-row-desc"
                        data-l10n-id="pref-noWatermark-desc"
                    />
                </html:div>
                <html:div class="p2z-row-ctl">
                    <html:input
                        id="__addonRef__-noWatermark"
                        class="p2z-switch"
                        type="checkbox"
                        data-pref="noWatermark"
                    />
                </html:div>
            </html:div>
            <html:div class="p2z-row">
                <html:div class="p2z-row-text">
                    <html:label
                        class="p2z-row-title"
                        for="__addonRef__-autoOcr"
                        data-l10n-id="pref-autoOcr"
                    />
                    <html:p
                        class="p2z-row-desc"
                        data-l10n-id="pref-autoOcr-desc"
                    />
                </html:div>
                <html:div class="p2z-row-ctl">
                    <html:input
                        id="__addonRef__-autoOcr"
